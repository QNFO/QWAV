name: QWAV Structure Enforcement

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  structure-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run structure enforcement
        run: python scripts/enforce-structure.py --report-only

      - name: Report status
        if: success()
        run: echo "✅ QWAV directory structure is clean"
