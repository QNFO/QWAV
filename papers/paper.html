<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="paper-title">QWAV Paper</title>
<meta id="meta-desc" name="description" content="">
<meta name="robots" content="index, follow">
<link id="canonical" rel="canonical" href="">
<meta property="og:type" content="article">
<meta id="og-title" property="og:title" content="">
<meta id="og-desc" property="og:description" content="">
<meta id="og-url" property="og:url" content="">
<meta name="keywords" content="ultrametric, quantum computing, p-adic, physics">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
<script>window.LIVING_PAPER_API='https://living-paper.pages.dev/api';</script>
<style>
  :root {
    --bg:#111827; --fg:#e5e7eb; --muted:#9ca3af;
    --link:#818cf8; --accent:#34d399;
    --border:rgba(129,140,248,0.12); --code-bg:rgba(0,0,0,0.25);
  }
  /* Light theme */
  [data-theme="light"] {
    --bg:#ffffff; --fg:#1f2937; --muted:#6b7280;
    --link:#4f46e5; --accent:#059669;
    --border:rgba(79,70,229,0.12); --code-bg:rgba(0,0,0,0.04);
  }
  /* System preference */
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:#ffffff; --fg:#1f2937; --muted:#6b7280;
      --link:#4f46e5; --accent:#059669;
      --border:rgba(79,70,229,0.12); --code-bg:rgba(0,0,0,0.04);
    }
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{font-size:18px}
  body{
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
    background:var(--bg);color:var(--fg);
    line-height:1.8;-webkit-font-smoothing:antialiased;
  }
  /* ---- nav ---- */
  nav{
    position:sticky;top:0;z-index:50;
    background:rgba(17,24,39,0.92);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    padding:.85rem 2rem;display:flex;justify-content:space-between;align-items:center;
  }
  .nav-brand{
    font-weight:700;font-size:1rem;
    background:linear-gradient(135deg,#818cf8,#c4b5fd);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  }
  nav a{color:var(--link);text-decoration:none;font-size:.85rem;transition:color .15s}
  nav a:hover{color:var(--accent)}
  /* ---- content ---- */
  article{
    max-width:900px;margin:0 auto;padding:2.5rem 2rem 5rem;
  }
  #loading{text-align:center;padding:4rem;color:var(--muted);font-size:1.1rem}
  #error{text-align:center;padding:4rem;color:#ef4444;display:none}
  #content{display:none}
  /* ---- typography ---- */
  #content h1{
    font-size:2.1rem;font-weight:700;line-height:1.3;margin-bottom:1.25rem;color:#f9fafb;
  }
  #content h2{
    font-size:1.35rem;font-weight:600;margin:2.5rem 0 .75rem;color:#e5e7eb;
    border-bottom:1px solid var(--border);padding-bottom:.35rem;
  }
  #content h3{font-size:1.1rem;font-weight:600;margin:1.75rem 0 .5rem;color:#d1d5db}
  #content h4{font-size:1rem;font-weight:600;margin:1.5rem 0 .5rem;color:var(--muted)}
  #content p{margin-bottom:1.2rem}
  #content a{color:var(--link);text-decoration:none;border-bottom:1px solid rgba(129,140,248,0.2);transition:border-color .15s}
  #content a:hover{border-bottom-color:var(--link)}
  #content strong{color:#f3f4f6;font-weight:600}
  #content em{color:#d1d5db}
  /* ---- code ---- */
  #content code{
    font-family:'SF Mono','Cascadia Code','Consolas',monospace;
    font-size:.82em;background:var(--code-bg);
    padding:.15em .4em;border-radius:4px;color:#e5e7eb;
  }
  #content pre{
    background:var(--code-bg);padding:1.2rem 1.4rem;border-radius:8px;
    overflow-x:auto;border:1px solid var(--border);
    margin:1.2rem 0;line-height:1.6;font-size:.85rem;
  }
  #content pre code{background:none;padding:0;font-size:inherit}
  /* ---- blockquote ---- */
  #content blockquote{
    border-left:3px solid var(--link);margin:1.2rem 0;
    padding:.6rem 1.2rem;color:var(--muted);background:rgba(129,140,248,0.03);
    border-radius:0 6px 6px 0;
  }
  #content blockquote p:last-child{margin-bottom:0}
  /* ---- tables ---- */
  #content table{border-collapse:collapse;width:100%;margin:1.2rem 0}
  #content th,#content td{
    border-bottom:1px solid var(--border);padding:.5rem .75rem;text-align:left;font-size:.9rem;
  }
  #content th{font-weight:600;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
  #content tr:first-child td{border-top:1px solid var(--border)}
  /* ---- lists ---- */
  #content ul,#content ol{margin:.8rem 0 .8rem 1.4rem}
  #content li{margin-bottom:.25rem}
  /* ---- images ---- */
  #content img{max-width:100%;border-radius:6px;margin:1rem 0}
  /* ---- math ---- */
  .math.display{display:block;text-align:center;margin:1.5rem 0;overflow-x:auto}
  /* ---- meta ---- */
  .meta{color:var(--muted);font-size:.8rem;margin-bottom:2rem;display:flex;gap:1rem;flex-wrap:wrap}
  .meta span{background:rgba(129,140,248,0.08);padding:.15em .6em;border-radius:3px;font-size:.75rem}
  /* ---- footer ---- */
  footer{border-top:1px solid var(--border);padding:2rem;text-align:center;max-width:900px;margin:0 auto}
  footer p{color:var(--muted);font-size:.72rem}
  footer a{color:var(--link);text-decoration:none}
  /* ---- responsive ---- */
  @media(max-width:768px){
    html{font-size:16px}
    nav{padding:.7rem 1rem}
    article{padding:1.5rem 1rem 3rem}
    #content h1{font-size:1.6rem}
  }
</style>
</head>
<body>
<nav>
  <span class="nav-brand">QWAV Research</span>
  <div>
    <a href="/">Home</a>
    <a href="/papers/" style="margin-left:1.5rem">Papers</a>
    <button id="theme-toggle" onclick="toggleTheme()" style="margin-left:1.5rem;background:none;border:1px solid var(--border);color:var(--fg);padding:.25rem .6rem;border-radius:4px;cursor:pointer;font-size:.8rem" title="Toggle light/dark theme">☀</button>
  </div>
</nav>
<article>
  <div id="loading">Loading paper...</div>
  <div id="error">Failed to load paper. <a href="/papers/">Browse catalog</a>.</div>
  <div id="content"></div>
</article>
<footer>
  <p>Licensed under <a href="https://github.com/QNFO/license">QNFO Content License v1.1</a>. Non-commercial use only.</p>
</footer>
<script id="jsonld" type="application/ld+json"></script>
<script src="/overlay.js"></script>
<script src="/sidebar.js"></script>
<script>
(async function() {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('p') || window.location.pathname.replace(/^\/papers\//,'').replace(/\/$/,'').replace(/\.html$/,'');
  if (!slug || slug === 'paper' || slug === 'index') { window.location.href = '/papers/'; return; }

  window.LIVING_PAPER_PAPER_ID = slug;
  document.getElementById('canonical').href = 'https://deep.qwav.tech/papers/' + slug;

  try {
    const res = await fetch('/api/paper/' + slug);
    if (!res.ok) throw new Error('Not found: ' + res.status);
    const raw = await res.text();

    let body = raw, title = slug.replace(/-/g, ' '), date = '', keywords = [], desc = '';
    if (raw.startsWith('---')) {
      const parts = raw.split('---', 3);
      if (parts.length >= 3) {
        for (const line of parts[1].trim().split('\n')) {
          const c = line.indexOf(':');
          if (c < 0) continue;
          const k = line.substring(0,c).trim(), v = line.substring(c+1).trim();
          if (k === 'title') title = v;
          else if (k === 'date' || k === 'modified') date = v;
          else if (k === 'keywords') keywords = v.split(',').map(s => s.trim());
          else if (k === 'description') desc = v;
        }
        body = parts.slice(2).join('---').trim();
      }
    }

    document.title = title + ' | QWAV';
    document.getElementById('paper-title').textContent = title + ' | QWAV';
    document.getElementById('meta-desc').content = desc || title;
    document.getElementById('og-title').content = title;
    document.getElementById('og-desc').content = desc || title;
    document.getElementById('og-url').content = 'https://deep.qwav.tech/papers/' + slug;
    document.getElementById('jsonld').textContent = JSON.stringify({
      '@context':'https://schema.org','@type':'ScholarlyArticle',
      'headline':title,'url':'https://deep.qwav.tech/papers/'+slug,
      'datePublished':date,'keywords':keywords,
      'license':'https://github.com/QNFO/license','isAccessibleForFree':true
    });

    const html = marked.parse(body);
    const metaHtml = (date || keywords.length) ?
      '<div class="meta">' + (date ? '<span>'+new Date(date).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})+'</span>' : '') +
      keywords.map(k => '<span>'+k+'</span>').join('') + '</div>' : '';

    document.getElementById('content').innerHTML = '<h1>'+title+'</h1>' + metaHtml + html;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';

    if (window.MathJax) { MathJax.typesetPromise(); }
  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').innerHTML += '<br><small>'+e.message+'</small>';
  }
})();
// Theme toggle
(function(){
  var t=localStorage.getItem('theme');
  if(!t) t=window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';
  document.documentElement.setAttribute('data-theme',t);
  document.getElementById('theme-toggle').textContent=t==='light'?'☽':'☀';
})();
function toggleTheme(){
  var c=document.documentElement.getAttribute('data-theme');
  var n=c==='light'?'dark':'light';
  document.documentElement.setAttribute('data-theme',n);
  localStorage.setItem('theme',n);
  document.getElementById('theme-toggle').textContent=n==='light'?'☽':'☀';
}
</script>
</body>
</html>
